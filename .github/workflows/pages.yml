name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/fervent-cray-z5cm86", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build index.html
        run: node build.mjs
      - name: Collect site files
        run: |
          mkdir -p _site/docs
          cp index.html _site/
          cp docs/banner.png docs/screenshot.png _site/docs/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
